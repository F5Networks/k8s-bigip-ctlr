apiVersion: cis.f5.com/v1
kind: F5BigIpCtlr
metadata:
  name: f5bigipctlr-sample
spec:
  args:
    log_as3_response: true
    manage_routes: true
    agent: as3
    log_level: "<DEBUG_OR_INFO>"
    route_vserver_addr: "<IP_ADDRESS>"
    bigip_partition: "<BIGIP_PARTITION>"
    openshift_sdn_name: "</BIGIP_PARTITION/SDN_NAME>"
    bigip_url: "<BIGIP_IP_ADDRESS>"
    insecure: true
    pool_member_type: "<cluster_or_nodeport_or_loadbalancer>"
    route_label: "<ROUTE_LABEL_F5TYPE>"
  bigip_login_secret: "<BIGIP_LOGIN_K8S_SECRET>"
  image:
    pullPolicy: Always
    repo: f5networks/cntr-ingress-svcs
    user: registry.connect.redhat.com
  namespace: kube-system
  rbac:
    create: true
  resources: {}
  serviceAccount:
    create: true
  ingressClass:
    create: false
    ingressClassName: f5
    defaultController: false
  version: latest
  # To disable securityContext entirely (useful on OpenShift where it should be
  # assigned automatically), set securityContext to one of: "none", "false", "no", "disable"
  # or set it to an empty map: securityContext: {}
  # securityContext: "none"
  # Or specify custom values:
  # securityContext:
  #   runAsUser: 1000
  #   runAsGroup: 1000
  #   fsGroup: 1000
